set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on

set -g mouse on
set -g history-limit 50000

# Let new tmux panes inherit Claude Code's IDE-integration vars from VSCode
set -ga update-environment "CLAUDE_CODE_SSE_PORT ENABLE_IDE_INTEGRATION CLAUDE_CODE_SSE_AUTH_TOKEN"
