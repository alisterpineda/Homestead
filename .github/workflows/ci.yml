name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Homestead.WebApi.Tests.Integration

      - name: Build
        run: dotnet build Homestead.WebApi.Tests.Integration --no-restore

      - name: Test
        run: >-
          dotnet test Homestead.WebApi.Tests.Integration
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger GitHubActions
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Generate Coverage Report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: './TestResults/**/coverage.cobertura.xml'
          targetdir: './CoverageReport'
          reporttypes: 'HtmlInline_AzurePipelines;MarkdownSummaryGithub'

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f ./CoverageReport/SummaryGithub.md ]; then
            cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: './TestResults/test-results.trx'

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: './CoverageReport'
