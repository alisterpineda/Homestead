name: CI

on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Homestead.WebApi.Tests.Unit

      - name: Build
        run: dotnet build Homestead.WebApi.Tests.Unit --no-restore

      - name: Test
        run: >-
          dotnet test
          --project Homestead.WebApi.Tests.Unit
          --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename unit-test-results.trx
          --coverage --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: './TestResults/unit-test-results.trx'

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: './TestResults/**/coverage.cobertura.xml'
          retention-days: 1

  integration-test:
    runs-on: ubuntu-latest
    env:
      Ocr__Engines__tesseract__TessDataPath: /usr/share/tessdata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Fetch pinned tessdata models
        run: sudo sh scripts/fetch-tessdata.sh /usr/share/tessdata

      - name: Restore
        run: dotnet restore Homestead.WebApi.Tests.Integration

      - name: Build
        run: dotnet build Homestead.WebApi.Tests.Integration --no-restore

      - name: Test
        run: >-
          dotnet test
          --project Homestead.WebApi.Tests.Integration
          --no-build
          --results-directory ./TestResults
          --report-trx --report-trx-filename test-results.trx
          --coverage --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: './TestResults/test-results.trx'

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: './TestResults/**/coverage.cobertura.xml'
          retention-days: 1

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: Homestead.WebApp
        run: npm ci

      - name: Run tests with coverage
        working-directory: Homestead.WebApp
        run: npm run test:ci

      - name: Group frontend coverage under Homestead.WebApp assembly
        working-directory: Homestead.WebApp
        run: |
          node -e "
          const fs = require('fs');
          const file = 'coverage/Homestead/cobertura-coverage.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const classes = [];
          const re = /<package name=\"([^\"]+)\"[^>]*>\s*<classes>([\s\S]*?)<\/classes>\s*<\/package>/g;
          let m;
          while ((m = re.exec(xml)) !== null) {
            classes.push(m[2].replace(/<class name=\"([^\"]+)\"/g, \`<class name=\"\${m[1]}.\$1\"\`));
          }
          const merged = '<package name=\"Homestead.WebApp\" line-rate=\"0\" branch-rate=\"0\"><classes>'
            + classes.join('') + '</classes></package>';
          xml = xml.replace(/<packages>[\s\S]*<\/packages>/, '<packages>' + merged + '</packages>');
          fs.writeFileSync(file, xml);
          "

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-coverage
          path: 'Homestead.WebApp/coverage/**/cobertura-coverage.xml'
          retention-days: 1

  build-image:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit

  e2e-test:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests

      - name: Pull and tag E2E image
        env:
          REGISTRY_IMAGE: alisterpineda/homestead
        run: |
          DIGEST=$(ls ${{ runner.temp }}/digests/)
          docker pull $REGISTRY_IMAGE@sha256:$DIGEST
          docker tag $REGISTRY_IMAGE@sha256:$DIGEST homestead:e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: Homestead.E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Homestead.E2E
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: Homestead.E2E
        env:
          SKIP_BUILD: '1'
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Homestead.E2E/playwright-report/
          retention-days: 7

  coverage-report:
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-test, integration-test, frontend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Unit Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: ./coverage/unit

      - name: Download Integration Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-test-coverage
          path: ./coverage/integration

      - name: Download Frontend Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-coverage
          path: ./coverage/frontend

      - name: Generate Merged Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: './coverage/**/*cobertura*.xml'
          targetdir: './CoverageReport'
          reporttypes: 'HtmlInline_AzurePipelines;MarkdownSummaryGithub'

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f ./CoverageReport/SummaryGithub.md ]; then
            cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: './CoverageReport'
          retention-days: 3
